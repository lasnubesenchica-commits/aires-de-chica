<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Aires de Chicá · App</title>
<link rel="icon" href="../brand/favicon.svg"/>
<link rel="stylesheet" href="../brand/palette.css"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box} body{margin:0;font-family:var(--ac-font);background:var(--ac-bg);color:var(--ac-ink)}
header{background:linear-gradient(120deg,#0B7A98,#12A2C4);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
header img{height:40px;background:#fff;border-radius:8px;padding:4px 6px}
header h1{font-size:1rem;margin:0} header .sub{font-size:.72rem;opacity:.85}
header .out{margin-left:auto;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px 10px;font:inherit}
.grad{height:4px;background:linear-gradient(90deg,var(--ac-teal),var(--ac-green) 60%,var(--ac-coral))}
.pad{padding:14px 16px 40px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.card{background:#fff;border:1px solid var(--ac-border);border-radius:12px;padding:12px 14px;box-shadow:var(--ac-shadow)}
.card .label{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ac-muted);font-weight:600}
.card .val{font-size:1.35rem;font-weight:700;margin-top:2px}
input{width:100%;padding:11px 14px;border:1px solid var(--ac-border);border-radius:10px;font:inherit;margin-bottom:12px}
.row{background:#fff;border:1px solid var(--ac-border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:var(--ac-shadow)}
.row .lote{font-weight:700;min-width:44px} .row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .row .nm span{font-size:.75rem;color:var(--ac-muted)}
.row .sal{text-align:right} .row .sal b{font-size:.95rem}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.68rem;font-weight:700}
.pill.ok{background:#e4f5ec;color:var(--ac-ok)} .pill.warn{background:#fbf0dc;color:var(--ac-warn)} .pill.red{background:#fbe6e3;color:var(--ac-danger)}
.sheet-bg{position:fixed;inset:0;background:rgba(16,48,57,.45);display:none;z-index:40} .sheet-bg.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;max-height:86vh;overflow:auto;z-index:41;transform:translateY(100%);transition:.25s} .sheet.show{transform:translateY(0)}
.sheet .sh{position:sticky;top:0;background:#fff;padding:16px;border-bottom:1px solid var(--ac-border);display:flex;justify-content:space-between;align-items:flex-start}
.sheet .sb{padding:14px 16px 30px}
table{width:100%;border-collapse:collapse;font-size:.85rem} td,th{padding:7px 6px;text-align:left}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums} th{font-size:.68rem;color:var(--ac-muted);text-transform:uppercase} tr{border-bottom:1px solid #eef5f8}
.close{border:0;background:none;font-size:1.5rem;color:var(--ac-muted)}
.tot{display:flex;justify-content:space-between;padding:10px 12px;background:var(--ac-teal-50);border-radius:8px;margin-top:8px}
/* conmutador de vistas: en un teléfono no caben pestañas, y dos vistas no necesitan más */
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;border:1px solid var(--ac-border);background:#fff;border-radius:10px;padding:9px;font:inherit;font-weight:600;color:var(--ac-muted)}
.seg button.on{background:var(--ac-teal);border-color:var(--ac-teal);color:#fff}
.aviso{border-radius:10px;padding:10px 12px;font-size:.82rem;margin-bottom:8px;border:1px solid}
.aviso.err{background:#fbe6e3;border-color:#f0c0b8;color:#8a2b1c}
.aviso.warn{background:#fbf0dc;border-color:#f4d9b0;color:#7a4a12}
.vis{background:#fff;border:1px solid var(--ac-border);border-radius:12px;padding:11px 13px;margin-bottom:8px;box-shadow:var(--ac-shadow)}
.vis .l1{display:flex;align-items:baseline;gap:8px} .vis .l1 b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vis .l2{font-size:.74rem;color:var(--ac-muted);margin-top:3px}
.acb{width:100%;padding:11px;border:1px solid var(--ac-border);border-radius:10px;background:#fff;font:inherit;font-weight:600;margin-top:8px}
.acb.go{background:var(--ac-teal);border-color:var(--ac-teal);color:#fff}
/* gate */
#gate{position:fixed;inset:0;background:var(--ac-bg);display:none;align-items:center;justify-content:center;padding:22px;z-index:100} #gate.show{display:flex}
.login{background:#fff;border:1px solid var(--ac-border);border-radius:16px;box-shadow:var(--ac-shadow);width:100%;max-width:360px;overflow:hidden}
.login .lb{padding:24px;text-align:center} .login img{height:60px;margin-bottom:4px} .login h2{margin:6px 0 2px;font-size:1.1rem} .login p{color:var(--ac-muted);font-size:.84rem;margin:0 0 14px}
.login .btn{width:100%;border:0;border-radius:10px;padding:12px;background:var(--ac-teal);color:#fff;font:inherit;font-weight:600}
.login .err{color:var(--ac-danger);font-size:.82rem;min-height:16px;margin-top:6px} #app{display:none}
</style>
</head>
<body>
<div id="gate"><div class="login"><div class="grad"></div><div class="lb">
  <img src="../brand/logo.png" alt="Aires de Chicá"/>
  <h2 id="gt">Acceso</h2><p id="gs">Ingresa la contraseña.</p>
  <form id="gf"><input type="password" id="gp" placeholder="Contraseña"/>
    <input type="password" id="gp2" placeholder="Repite la contraseña" style="display:none"/>
    <button class="btn" id="gb" type="submit">Entrar</button><div class="err" id="ge"></div></form>
</div></div></div>

<div id="app">
<header><img src="../brand/logo.png" alt="Aires de Chicá"/>
  <div><h1>Aires de Chicá</h1><div class="sub">Estados de cuenta · 2026</div></div>
  <button class="out" id="quien" onclick="pedirAutor()" title="Quién usa la app">Identifícate</button>
  <button class="out" onclick="logout()">Salir</button></header>
<div class="grad"></div>
<div class="pad">
  <div class="seg" id="seg" style="display:none">
    <button id="segCta" class="on" onclick="verVista('cuentas')">Cuentas</button>
    <button id="segAcc" onclick="verVista('acceso')">Acceso</button>
  </div>
  <div id="vCuentas">
    <div class="summary" id="summary"></div>
    <input type="search" id="q" placeholder="Buscar lote o propietario…"/>
    <div id="list"></div>
  </div>
  <div id="vAcceso" style="display:none"><p style="color:var(--ac-muted)">Cargando…</p></div>
</div>
<div class="sheet-bg" id="sheetBg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><div class="grad"></div><div class="sh" id="sheetHd"></div><div class="sb" id="sheetBd"></div></div>
</div>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbwuRoK_23HiOcqkR0itIV87lYH8YKzh-jIGnuJRWyZa9_QubxbjzlZnVU2BryyGikB4/exec';
let TOKEN=localStorage.getItem('ac_token')||'';
const money=n=>'B/.'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function jsonp(action,params={}){return new Promise((res,rej)=>{const cb='__cb'+Math.random().toString(36).slice(2);
  const qs=Object.entries({action,token:TOKEN,...params,callback:cb}).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
  const s=document.createElement('script');s.src=GAS_URL+'?'+qs;window[cb]=d=>{delete window[cb];s.remove();d.ok?res(d.data):rej(d.error)};s.onerror=()=>{s.remove();rej('network')};document.body.appendChild(s);});}
/* ───────── Quién usa la app ─────────
 * El servidor exige saber QUIÉN hace cada cambio: sin autor devuelve «sin-autor» y no
 * escribe nada. El móvil no lo mandaba, así que el botón de enviar el estado de cuenta
 * nunca llegó a funcionar.
 *
 * Y no basta con preguntar el nombre: el servidor lleva un padrón donde cada nombre
 * queda apartado para UN dispositivo, y rechaza con «autor-de-otro» lo que se firme
 * con el nombre de otro equipo. Por eso se usan las MISMAS claves de navegador que el
 * panel de escritorio (bc_autor / bc_dev): el panel y la app viven en el mismo dominio,
 * así que si cada uno inventara su propio identificador de equipo, el mismo teléfono
 * sería dos dispositivos distintos y el nombre reservado desde el panel no serviría
 * aquí. */
let AUTOR=localStorage.getItem('bc_autor')||'';
let DISPOSITIVO=localStorage.getItem('bc_dev')||'';
if(!DISPOSITIVO){
  DISPOSITIVO=(window.crypto&&crypto.randomUUID)?crypto.randomUUID()
             :'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
  try{localStorage.setItem('bc_dev',DISPOSITIVO);}catch(e){}
}
function _setAutor(n){AUTOR=String(n||'').trim().slice(0,60);
  if(AUTOR)localStorage.setItem('bc_autor',AUTOR);else localStorage.removeItem('bc_autor');pintarAutor();}
function pintarAutor(){const e=document.getElementById('quien'); if(e)e.textContent=AUTOR||'Identifícate';}
// Misma normalización que el servidor: mayúsculas y tildes no distinguen.
const _nomClave=n=>String(n||'').replace(/\s+/g,' ').trim().toUpperCase()
  .replace(/[ÁÀÄÂ]/g,'A').replace(/[ÉÈËÊ]/g,'E').replace(/[ÍÌÏÎ]/g,'I')
  .replace(/[ÓÒÖÔ]/g,'O').replace(/[ÚÙÜÛ]/g,'U').replace(/Ñ/g,'N');
/** El padrón manda sobre lo guardado en el teléfono, igual que en el escritorio. */
function _sincronizarAutor(d){
  const yo=(d&&d.yo)||'', lista=(d&&d.usuarios)||[];
  if(yo){if(yo!==AUTOR)_setAutor(yo);return;}
  if(!AUTOR)return;
  const mismo=lista.find(u=>_nomClave(u.nombre)===_nomClave(AUTOR));
  if(mismo&&!mismo.mio)_setAutor('');   // es de otro equipo: aquí ya no se puede firmar
}
/** El selector de identidad: el padrón, no un campo libre. */
async function pedirAutor(){
  document.getElementById('sheetHd').innerHTML=
    `<div style="font-weight:700">¿Quién usa la app?</div><button class="close" onclick="closeSheet()">×</button>`;
  document.getElementById('sheetBd').innerHTML='<p style="color:var(--ac-muted)">Leyendo los nombres registrados…</p>';
  document.getElementById('sheetBg').classList.add('show');document.getElementById('sheet').classList.add('show');
  let d=null;
  try{d=await jsonp('getAutores',{dispositivo:DISPOSITIVO});}
  catch(e){if(authErr(e))return;}
  if(d)_sincronizarAutor(d);
  const otros=((d&&d.usuarios)||[]).filter(u=>!u.mio);
  const mio=((d&&d.usuarios)||[]).find(u=>u.mio);
  document.getElementById('sheetBd').innerHTML=`
    <p style="font-size:.8rem;color:var(--ac-muted);margin-top:0">Tu nombre queda anotado en <b>cada cambio</b> y no se borra de la bitácora. Cada nombre se reserva para un equipo.</p>
    ${d?'':'<div class="aviso warn">No se pudo leer la lista de nombres. Puedes escribir el tuyo igual.</div>'}
    ${mio?`<div class="aviso" style="background:#e4f5ec;border-color:#bfe5d0;color:#14663f">En este teléfono eres <b>${mio.nombre}</b>.</div>`:''}
    ${otros.length?`<div style="font-size:.72rem;color:var(--ac-muted);font-weight:600;margin:10px 0 4px">NOMBRES YA TOMADOS</div>
      <p style="font-size:.76rem;color:var(--ac-muted);margin:0 0 8px">Están apartados para otro equipo. Si alguno es tuyo y cambiaste de teléfono, pásalo desde el panel de escritorio con la contraseña.</p>
      ${otros.map(u=>`<div class="vis"><b>${u.nombre}</b> <span style="color:var(--ac-muted);font-size:.76rem">· en otro dispositivo</span></div>`).join('')}`:''}
    <label style="font-size:.72rem;color:var(--ac-muted);font-weight:600">Tu nombre</label>
    <input id="idNom" maxlength="60" value="${(AUTOR||'').replace(/"/g,'&quot;')}" placeholder="Tu nombre"/>
    <div id="idErr" style="color:var(--ac-danger);font-size:.8rem;min-height:14px"></div>
    <button class="acb go" onclick="guardarAutor(this)">Identificarme</button>`;
  const i=document.getElementById('idNom'); if(i){i.focus();i.select();}
  return false;   // identificarse es asíncrono: la acción que lo pidió no continúa
}
async function guardarAutor(btn){
  const nombre=(document.getElementById('idNom').value||'').trim().slice(0,60);
  const err=document.getElementById('idErr');err.textContent='';
  if(!nombre){err.textContent='Escribe un nombre.';return;}
  btn.disabled=true;const t=btn.textContent;btn.textContent='…';
  let r;
  try{r=await _enviar('claimAutor',{nombre,autor:nombre});}
  catch(e){
    btn.disabled=false;btn.textContent=t;
    if(authErr(e))return;
    err.textContent=String(e)==='nombre-tomado'
      ? '«'+nombre+'» ya está tomado por otro equipo. Escoge otro, o pásalo a este teléfono desde el panel de escritorio.'
      : 'No se pudo guardar: '+e;
    return;
  }
  _setAutor((r&&r.nombre)||nombre);
  closeSheet();
}
function exigirAutor(){if(AUTOR)return true;pedirAutor();return false;}
/** El envío crudo. Lo usa claimAutor, que es justo la acción que todavía no tiene autor. */
async function _enviar(action,data={}){
  const r=await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action,token:TOKEN,autor:AUTOR,dispositivo:DISPOSITIVO,...data})});
  const j=await r.json();if(!j.ok)throw j.error;return j.data;}
async function post(action,data={}){
  if(!exigirAutor())throw 'sin-autor';
  return _enviar(action,data);}
function authErr(e){
  if(String(e)==='no-auth'){TOKEN='';localStorage.removeItem('ac_token');gate('login');return true;}
  // El nombre con el que se firmó está apartado para otro equipo. Sin esto el móvil
  // enseñaba «Error: autor-de-otro» y dejaba el nombre inservible guardado para siempre.
  if(String(e)==='autor-de-otro'){
    alert('El cambio no se guardó.\n\n«'+AUTOR+'» está reservado para otro dispositivo, así que desde este teléfono no se puede firmar con ese nombre.\n\nIdentifícate con tu propio nombre.');
    _setAutor('');pedirAutor();return true;
  }
  return false;}

let MODE='login';
function gate(m){MODE=m;document.getElementById('app').style.display='none';document.getElementById('gate').classList.add('show');
  document.getElementById('gt').textContent=m==='setup'?'Crear contraseña':'Acceso';
  document.getElementById('gs').textContent=m==='setup'?'Primera vez: define la contraseña.':'Ingresa la contraseña.';
  document.getElementById('gp2').style.display=m==='setup'?'block':'none';document.getElementById('gb').textContent=m==='setup'?'Crear y entrar':'Entrar';
  document.getElementById('gp').value='';document.getElementById('gp2').value='';document.getElementById('ge').textContent='';}
function showApp(){document.getElementById('gate').classList.remove('show');document.getElementById('app').style.display='block';}
let MODULOS=null, HAY_FIN=true, HAY_ACC=true;
async function boot(){let st;try{st=await jsonp('getAuthState');}catch(e){st={hasPassword:false};}
  if(!st.hasPassword){gate('setup');return;} if(!TOKEN){gate('login');return;}
  MODULOS=st.modulos||null; pintarAutor();
  // Sin lista de módulos no se esconde nada: que falte un dato no puede dejar a nadie
  // sin su panel. Con lista, cada vista sólo aparece si su módulo está contratado —
  // las cuentas también: una comunidad que sólo contrató el acceso abría la app en una
  // vista cuyo getDashboard el servidor rechaza, y se quedaba fuera de su propia app.
  const mods=(Array.isArray(MODULOS)&&MODULOS.length)?MODULOS:null;
  HAY_FIN=!mods||mods.indexOf('financiero')>=0;
  HAY_ACC=!mods||mods.indexOf('acceso')>=0;
  if(HAY_FIN&&HAY_ACC)document.getElementById('seg').style.display='flex';
  try{
    if(HAY_FIN)await load();
    else if(HAY_ACC)verVista('acceso');
    else{document.getElementById('vCuentas').innerHTML=
      '<div class="aviso warn">Esta comunidad no tiene ningún módulo con vista en el teléfono. Entra desde el panel de escritorio.</div>';}
    showApp();
  }catch(e){if(!authErr(e))gate('login');}}

/* ───────── la vista de acceso ─────────
 * En un teléfono lo que hace falta es la bitácora: quién está adentro ahora y qué pasó
 * anoche. Cargar contactos y dejar permisos es trabajo de escritorio — y desde que el
 * propietario se los gestiona por WhatsApp, cada vez menos de nadie.
 */
let ACC=null;
function verVista(v){
  document.getElementById('vCuentas').style.display=v==='cuentas'?'block':'none';
  document.getElementById('vAcceso').style.display=v==='acceso'?'block':'none';
  document.getElementById('segCta').className=v==='cuentas'?'on':'';
  document.getElementById('segAcc').className=v==='acceso'?'on':'';
  if(v==='acceso')cargarAcceso();
}
async function cargarAcceso(force){
  const box=document.getElementById('vAcceso');
  if(ACC&&!force){pintarAcceso();return;}
  box.innerHTML='<p style="color:var(--ac-muted)">Cargando…</p>';
  try{ACC=await jsonp('getAcceso');}
  catch(e){if(authErr(e))return; box.innerHTML='<div class="aviso err">No se pudo cargar: '+e+'</div>';return;}
  pintarAcceso();
}
const ACC_EST={autorizada:['ok','autorizada'],preautorizada:['ok','preautorizada'],
  rechazada:['red','rechazada'],pendiente:['warn','pendiente'],'sin-respuesta':['warn','sin respuesta']};
function pintarAcceso(){
  const d=ACC,vs=d.visitas||[];
  const avisos=(d.avisos||[]).map(a=>`<div class="aviso ${a.tipo==='error'?'err':'warn'}">${a.texto}</div>`).join('');
  const filas=vs.length?vs.map(v=>{
    const [c,t]=ACC_EST[v.estado]||['warn',v.estado||'—'];
    return `<div class="vis" onclick="abrirVisita('${v.id}')">
      <div class="l1"><b>${v.visitante||'Sin nombre'}</b><span class="pill ${c}">${t}</span></div>
      <div class="l2">${v.fecha||''}${v.lote?' · '+(d.unidad||'unidad')+' '+v.lote:''}${v.salida?' · salió '+v.salida:''}</div>
      ${v.autorizadoPor?`<div class="l2">${v.autorizadoPor}</div>`:''}</div>`;
  }).join(''):'<p style="color:var(--ac-muted)">Todavía no ha entrado nadie.</p>';
  document.getElementById('vAcceso').innerHTML=`${avisos}
    <div class="summary">
      <div class="card"><div class="label">Adentro ahora</div><div class="val">${d.adentro||0}</div></div>
      <div class="card"><div class="label">Sin cerrar</div><div class="val" style="color:${d.colgadas?'var(--ac-warn)':'inherit'}">${d.colgadas||0}</div></div>
    </div>
    <button class="acb" onclick="cargarAcceso(true)">Actualizar</button>
    <div style="margin-top:12px">${filas}</div>`;
}
function abrirVisita(id){
  const v=(ACC.visitas||[]).find(x=>x.id===id); if(!v)return;
  const entro=v.estado==='autorizada'||v.estado==='preautorizada';
  document.getElementById('sheetHd').innerHTML=`<div><div style="font-weight:700">${v.visitante||'Sin nombre'}</div>
    <div style="font-size:.78rem;color:var(--ac-muted)">${v.fecha||''}${v.lote?' · '+(ACC.unidad||'unidad')+' '+v.lote:''}</div></div>
    <button class="close" onclick="closeSheet()">×</button>`;
  document.getElementById('sheetBd').innerHTML=`
    <div style="font-size:.82rem;color:var(--ac-muted);margin-bottom:10px">
      Estado: <b>${v.estado||'—'}</b>${v.autorizadoPor?' · '+v.autorizadoPor:''}${v.salida?'<br>Salió: '+v.salida:''}</div>
    <label style="font-size:.72rem;color:var(--ac-muted);font-weight:600">Nombre</label>
    <input id="mv_nom" value="${(v.visitante||'').replace(/"/g,'&quot;')}"/>
    <label style="font-size:.72rem;color:var(--ac-muted);font-weight:600">Documento</label>
    <input id="mv_ced" value="${(v.cedula||'').replace(/"/g,'&quot;')}"/>
    <div id="mvErr" style="color:var(--ac-danger);font-size:.8rem;min-height:14px"></div>
    <button class="acb go" onclick="accionVisita('corregir','${id}',this)">Guardar corrección</button>
    ${entro&&!v.salida?`<button class="acb" onclick="accionVisita('salida','${id}',this)">Anotar que salió</button>`:''}
    ${v.estado==='pendiente'?`<button class="acb" onclick="accionVisita('cerrar','${id}',this)">Cerrar: nadie contestó</button>`:''}
    <div style="font-size:.7rem;color:var(--ac-muted);margin-top:10px">
      Desde aquí no se autoriza una entrada: eso lo decide quien tiene el documento delante.
      Lo que cambies queda firmado con tu nombre.</div>`;
  document.getElementById('sheetBg').classList.add('show');document.getElementById('sheet').classList.add('show');
}
async function accionVisita(que,id,btn){
  const err=document.getElementById('mvErr');err.textContent='';
  btn.disabled=true;const t=btn.textContent;btn.textContent='…';
  try{
    if(que==='salida')      await post('anotarSalida',{id});
    else if(que==='cerrar'){
      if(!confirm('Cerrar como «sin respuesta»: nadie contestó y no consta que entrara.')){
        btn.disabled=false;btn.textContent=t;return;}
      await post('cerrarVisita',{id,estado:'sin-respuesta'});
    } else {
      const g=i=>(document.getElementById(i).value||'').trim();
      await post('corregirVisita',{id,datos:{visitante:g('mv_nom'),cedula:g('mv_ced')}});
    }
    closeSheet();await cargarAcceso(true);
  }catch(e){btn.disabled=false;btn.textContent=t;if(!authErr(e))err.textContent='Error: '+e;}
}
document.getElementById('gf').addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('ge');err.textContent='';
  const pwd=document.getElementById('gp').value;
  try{let r; if(MODE==='setup'){if(pwd!==document.getElementById('gp2').value){err.textContent='No coinciden.';return;} r=await post('setPassword',{nueva:pwd});}
    else{r=await post('verifyPassword',{password:pwd}); if(!r.ok){err.textContent='Contraseña incorrecta.';return;}}
    TOKEN=r.token;localStorage.setItem('ac_token',TOKEN);await load();showApp();}catch(ex){err.textContent='Error: '+ex;}});
function logout(){TOKEN='';localStorage.removeItem('ac_token');gate('login');}

let CUENTAS=[];
const pill=e=>e==='Al día'?'<span class="pill ok">Al día</span>':e==='Pendiente'?'<span class="pill warn">Pendiente</span>':'<span class="pill red">Moroso</span>';
async function load(){
  const d=await jsonp('getDashboard'); CUENTAS=d.cuentas;
  const con=CUENTAS.filter(c=>c.saldoConMora>0.009).length, cartera=CUENTAS.reduce((a,c)=>a+c.saldoConMora,0);
  document.getElementById('summary').innerHTML=
    `<div class="card"><div class="label">Por cobrar</div><div class="val" style="color:var(--ac-coral)">${money(cartera)}</div></div>
     <div class="card"><div class="label">Cuentas con saldo</div><div class="val">${con} / ${CUENTAS.length}</div></div>`;
  draw();
}
function draw(){const q=document.getElementById('q').value.toLowerCase();
  const rows=CUENTAS.filter(c=>!q||c.nombre.toLowerCase().includes(q)||String(c.lote).toLowerCase().includes(q)).sort((a,b)=>b.saldoConMora-a.saldoConMora);
  document.getElementById('list').innerHTML=rows.map(c=>`<div class="row" onclick="openSheet('${c.clave}')">
    <div class="lote">${c.lote}</div><div class="nm"><b>${c.nombre}</b><span>${c.residencial}</span></div>
    <div class="sal"><b>${money(c.saldoConMora)}</b><div>${pill(c.estado)}</div></div></div>`).join('')||'<p class="muted">Sin resultados.</p>';}
document.getElementById('q').oninput=draw;
// Explicación de cada mes con los criterios de cobro aprobados por la Junta.
// En móvil no hay hover, así que se abre tocando la fila.
function _expMes(e,b,esUltimo){
  const L=[];
  if(b.cuota) L.push(`<b>Cuota</b> ${money(b.cuota)} — vence el último día de ${b.label}, sin período de gracia.`);
  if(b.condonada) L.push(`<b>Mora</b> — recargo condonado por la administración.`);
  else if(b.mora>0.009) L.push(`<b>Mora</b> ${money(b.mora)} — 10% de la cuota íntegra (${money(b.cuota)}) porque al cerrar ${b.label} quedaban ${money(b.descubierto||0)} sin cubrir. Cargo único; la mora no genera mora.`);
  else if(b.cuota&&esUltimo) L.push(`<b>Mora</b> — ${b.label} es el mes en curso: aún no vence.`);
  else if(b.cuota&&b.ym&&b.ym<'2026-04') L.push(`<b>Mora</b> — la mora rige desde abril 2026.`);
  else if(b.cuota) L.push(`<b>Mora</b> — sin recargo: la cuota de ${b.label} quedó cubierta.`);
  if(b.saldoIni!==undefined&&b.pagado){
    const a=[];
    if(b.apVencidas>0.009)   a.push(`${money(b.apVencidas)} a cuotas vencidas`);
    if(b.apMesEnCurso>0.009) a.push(`${money(b.apMesEnCurso)} a la cuota de ${b.label}`);
    if(b.apMora>0.009)       a.push(`${money(b.apMora)} a recargos por mora`);
    if(b.apCredito>0.009)    a.push(`${money(b.apCredito)} a saldo a favor`);
    L.push(`<b>Pagado</b> ${money(b.pagado)} — se aplicó así: ${a.join(', ')}. El orden es: cuotas vencidas → cuota del mes en curso → recargos por mora.`);
  }
  if(b.saldoIni!==undefined) L.push(`<b>Saldo</b> = ${money(b.saldoIni)} anterior + ${money(b.cuota)} cuota + ${money(b.mora||0)} recargo − ${money(b.pagado)} pagos = ${money(b.saldo)}.`);
  return L.join('<br>');
}
function expMes(tr){const n=tr.nextElementSibling;if(n&&n.classList.contains('exp'))n.style.display=n.style.display==='table-row'?'none':'table-row';}
function openSheet(clave){const e=CUENTAS.find(c=>c.clave===clave);if(!e||!e.mensual)return;
  const color=e.saldoConMora>0.009?(e.diasVencido>0?'var(--ac-danger)':'var(--ac-warn)'):'var(--ac-ok)';
  document.getElementById('sheetHd').innerHTML=`<div><div style="font-weight:700">${e.nombre}</div>
    <div style="font-size:.78rem;color:var(--ac-muted)">${e.residencial} · Lote ${e.lote} · Cuota ${money(e.cuota)}</div></div><button class="close" onclick="closeSheet()">×</button>`;
  document.getElementById('sheetBd').innerHTML=`<table><thead><tr><th>Mes</th><th class="n">Cuota</th><th class="n">Mora</th><th class="n">Pagado</th><th class="n">Saldo total</th></tr></thead>
    <tbody>${e.mensual.map((b,i,arr)=>`<tr onclick="expMes(this)" style="cursor:pointer"><td>${b.label}</td><td class="n">${b.cuota?money(b.cuota):'—'}</td>
      <td class="n" style="${b.mora>0.009?'color:var(--ac-coral)':''}">${b.condonada?'condon.':(b.mora>0.009?money(b.mora):'—')}</td>
      <td class="n">${b.pagado?money(b.pagado):(b.cuota?'0.00':'—')}</td>
      <td class="n" style="font-weight:600;${b.saldo>0.009?'color:var(--ac-danger)':b.saldo<-0.009?'color:var(--ac-ok)':''}">${money(b.saldo)}</td></tr>
      <tr class="exp" style="display:none"><td colspan="5" style="font-size:.72rem;line-height:1.6;color:var(--ac-muted);background:#f7f9fa;padding:8px 10px">${_expMes(e,b,i===arr.length-1)}</td></tr>`).join('')}</tbody></table>
    <div class="tot"><b>SALDO TOTAL</b><b style="color:${color}">${money(e.saldoNeto)}</b></div>
    <div class="muted" style="font-size:.7rem;margin-top:8px">Toca cualquier mes para ver cómo se calculó.</div>
    <button style="margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--ac-teal);color:#fff;font:inherit;font-weight:600" onclick="mail('${e.clave}')" ${e.email?'':'disabled'}>Enviar estado de cuenta por correo</button>`;
  document.getElementById('sheetBg').classList.add('show');document.getElementById('sheet').classList.add('show');}
function closeSheet(){document.getElementById('sheetBg').classList.remove('show');document.getElementById('sheet').classList.remove('show');}
async function mail(clave){try{const r=await post('enviarEstado',{clave});alert(r.enviado?'Enviado':'No enviado');}catch(e){if(!authErr(e))alert('Error: '+e);}}
boot();
</script>
