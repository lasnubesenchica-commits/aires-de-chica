<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Aires de Chicá · App</title>
<link rel="icon" href="../brand/favicon.svg"/>
<link rel="stylesheet" href="../brand/palette.css"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box} body{margin:0;font-family:var(--ac-font);background:var(--ac-bg);color:var(--ac-ink)}
header{background:linear-gradient(120deg,#0B7A98,#12A2C4);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
header img{height:40px;background:#fff;border-radius:8px;padding:4px 6px}
header h1{font-size:1rem;margin:0} header .sub{font-size:.72rem;opacity:.85}
header .out{margin-left:auto;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px 10px;font:inherit}
.grad{height:4px;background:linear-gradient(90deg,var(--ac-teal),var(--ac-green) 60%,var(--ac-coral))}
.pad{padding:14px 16px 40px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.card{background:#fff;border:1px solid var(--ac-border);border-radius:12px;padding:12px 14px;box-shadow:var(--ac-shadow)}
.card .label{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ac-muted);font-weight:600}
.card .val{font-size:1.35rem;font-weight:700;margin-top:2px}
input{width:100%;padding:11px 14px;border:1px solid var(--ac-border);border-radius:10px;font:inherit;margin-bottom:12px}
.row{background:#fff;border:1px solid var(--ac-border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:var(--ac-shadow)}
.row .lote{font-weight:700;min-width:44px} .row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .row .nm span{font-size:.75rem;color:var(--ac-muted)}
.row .sal{text-align:right} .row .sal b{font-size:.95rem}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.68rem;font-weight:700}
.pill.ok{background:#e4f5ec;color:var(--ac-ok)} .pill.warn{background:#fbf0dc;color:var(--ac-warn)} .pill.red{background:#fbe6e3;color:var(--ac-danger)}
.sheet-bg{position:fixed;inset:0;background:rgba(16,48,57,.45);display:none;z-index:40} .sheet-bg.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;max-height:86vh;overflow:auto;z-index:41;transform:translateY(100%);transition:.25s} .sheet.show{transform:translateY(0)}
.sheet .sh{position:sticky;top:0;background:#fff;padding:16px;border-bottom:1px solid var(--ac-border);display:flex;justify-content:space-between;align-items:flex-start}
.sheet .sb{padding:14px 16px 30px}
table{width:100%;border-collapse:collapse;font-size:.85rem} td,th{padding:7px 6px;text-align:left}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums} th{font-size:.68rem;color:var(--ac-muted);text-transform:uppercase} tr{border-bottom:1px solid #eef5f8}
.close{border:0;background:none;font-size:1.5rem;color:var(--ac-muted)}
.tot{display:flex;justify-content:space-between;padding:10px 12px;background:var(--ac-teal-50);border-radius:8px;margin-top:8px}
/* Conmutador de vistas. En un teléfono no caben pestañas de escritorio, así que se
   desliza de lado en vez de encoger las etiquetas hasta que no se lean. */
.seg{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:1px solid var(--ac-border);background:#fff;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;color:var(--ac-muted);white-space:nowrap}
.seg button.on{background:var(--ac-teal);border-color:var(--ac-teal);color:#fff}
.seg.sub button{padding:7px 11px;font-size:.84rem}
select,textarea{width:100%;padding:11px 14px;border:1px solid var(--ac-border);border-radius:10px;font:inherit;margin-bottom:12px;background:#fff}
label.lb{display:block;font-size:.72rem;color:var(--ac-muted);font-weight:600;margin-bottom:3px}
label.chk{display:flex;align-items:center;gap:9px;margin-bottom:12px;font-size:.88rem}
label.chk input{width:auto;margin:0}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.lnk{background:none;border:0;font:inherit;font-weight:600;color:var(--ac-teal);padding:0;text-decoration:underline}
.lnk.del{color:var(--ac-danger)}
details{margin-top:12px} summary{cursor:pointer;font-weight:600;font-size:.86rem;padding:6px 0}
.badge{display:inline-block;font-size:.66rem;font-weight:700;border-radius:6px;padding:1px 6px;border:1px solid}
.badge.ok{color:#16a34a;background:#ecfdf5;border-color:#16a34a44}
.badge.warn{color:#b45309;background:#fffbeb;border-color:#b4530944}
.badge.bad{color:#b91c1c;background:#fef2f2;border-color:#b91c1c44}
.dia{font-size:.72rem;font-weight:700;color:var(--ac-muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
.flash{font-size:.8rem;color:var(--ac-teal);font-weight:600;min-height:16px}
.dias{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.dias label{flex:1;min-width:40px;text-align:center;border:1px solid var(--ac-border);border-radius:9px;padding:7px 0;font-size:.82rem;font-weight:600;background:#fff}
.dias input{display:none} .dias input:checked+span{color:var(--ac-teal)}
.dias label:has(input:checked){background:var(--ac-teal-50);border-color:var(--ac-teal)}
.aviso{border-radius:10px;padding:10px 12px;font-size:.82rem;margin-bottom:8px;border:1px solid}
.aviso.err{background:#fbe6e3;border-color:#f0c0b8;color:#8a2b1c}
.aviso.warn{background:#fbf0dc;border-color:#f4d9b0;color:#7a4a12}
.vis{background:#fff;border:1px solid var(--ac-border);border-radius:12px;padding:11px 13px;margin-bottom:8px;box-shadow:var(--ac-shadow)}
.vis .l1{display:flex;align-items:baseline;gap:8px} .vis .l1 b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vis .l2{font-size:.74rem;color:var(--ac-muted);margin-top:3px}
.acb{width:100%;padding:11px;border:1px solid var(--ac-border);border-radius:10px;background:#fff;font:inherit;font-weight:600;margin-top:8px}
.acb.go{background:var(--ac-teal);border-color:var(--ac-teal);color:#fff}
/* gate */
#gate{position:fixed;inset:0;background:var(--ac-bg);display:none;align-items:center;justify-content:center;padding:22px;z-index:100} #gate.show{display:flex}
.login{background:#fff;border:1px solid var(--ac-border);border-radius:16px;box-shadow:var(--ac-shadow);width:100%;max-width:360px;overflow:hidden}
.login .lb{padding:24px;text-align:center} .login img{height:60px;margin-bottom:4px} .login h2{margin:6px 0 2px;font-size:1.1rem} .login p{color:var(--ac-muted);font-size:.84rem;margin:0 0 14px}
.login .btn{width:100%;border:0;border-radius:10px;padding:12px;background:var(--ac-teal);color:#fff;font:inherit;font-weight:600}
.login .err{color:var(--ac-danger);font-size:.82rem;min-height:16px;margin-top:6px} #app{display:none}
</style>
</head>
<body>
<div id="gate"><div class="login"><div class="grad"></div><div class="lb">
  <img src="../brand/logo.png" alt="Aires de Chicá"/>
  <h2 id="gt">Acceso</h2><p id="gs">Ingresa la contraseña.</p>
  <form id="gf"><input type="password" id="gp" placeholder="Contraseña"/>
    <input type="password" id="gp2" placeholder="Repite la contraseña" style="display:none"/>
    <button class="btn" id="gb" type="submit">Entrar</button><div class="err" id="ge"></div></form>
</div></div></div>

<div id="app">
<header><img src="../brand/logo.png" alt="Aires de Chicá"/>
  <div><h1>Aires de Chicá</h1><div class="sub">Estados de cuenta · 2026</div></div>
  <button class="out" id="quien" onclick="pedirAutor()" title="Quién usa la app">Identifícate</button>
  <button class="out" onclick="logout()">Salir</button></header>
<div class="grad"></div>
<div class="pad">
  <div class="seg" id="seg" style="display:none">
    <button id="segCta" class="on" onclick="verVista('cuentas')">Cuentas</button>
    <button id="segAcc" onclick="verVista('acceso')">Acceso</button>
    <button id="segCmp" onclick="verVista('comprob')">Comprobantes</button>
    <button id="segReg" onclick="verVista('registro')">Registro</button>
  </div>
  <div id="vCuentas">
    <div class="summary" id="summary"></div>
    <input type="search" id="q" placeholder="Buscar lote o propietario…"/>
    <div id="list"></div>
  </div>
  <div id="vAcceso" style="display:none"><p style="color:var(--ac-muted)">Cargando…</p></div>
  <div id="vComprob" style="display:none"><p style="color:var(--ac-muted)">Cargando…</p></div>
  <div id="vRegistro" style="display:none"><p style="color:var(--ac-muted)">Cargando…</p></div>
</div>
<div class="sheet-bg" id="sheetBg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><div class="grad"></div><div class="sh" id="sheetHd"></div><div class="sb" id="sheetBd"></div></div>
</div>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbwuRoK_23HiOcqkR0itIV87lYH8YKzh-jIGnuJRWyZa9_QubxbjzlZnVU2BryyGikB4/exec';
let TOKEN=localStorage.getItem('ac_token')||'';
const money=n=>'B/.'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function jsonp(action,params={}){return new Promise((res,rej)=>{const cb='__cb'+Math.random().toString(36).slice(2);
  const qs=Object.entries({action,token:TOKEN,...params,callback:cb}).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
  const s=document.createElement('script');s.src=GAS_URL+'?'+qs;window[cb]=d=>{delete window[cb];s.remove();d.ok?res(d.data):rej(d.error)};s.onerror=()=>{s.remove();rej('network')};document.body.appendChild(s);});}
/* ───────── Quién usa la app ─────────
 * El servidor exige saber QUIÉN hace cada cambio: sin autor devuelve «sin-autor» y no
 * escribe nada. El móvil no lo mandaba, así que el botón de enviar el estado de cuenta
 * nunca llegó a funcionar.
 *
 * Y no basta con preguntar el nombre: el servidor lleva un padrón donde cada nombre
 * queda apartado para UN dispositivo, y rechaza con «autor-de-otro» lo que se firme
 * con el nombre de otro equipo. Por eso se usan las MISMAS claves de navegador que el
 * panel de escritorio (bc_autor / bc_dev): el panel y la app viven en el mismo dominio,
 * así que si cada uno inventara su propio identificador de equipo, el mismo teléfono
 * sería dos dispositivos distintos y el nombre reservado desde el panel no serviría
 * aquí. */
let AUTOR=localStorage.getItem('bc_autor')||'';
let DISPOSITIVO=localStorage.getItem('bc_dev')||'';
if(!DISPOSITIVO){
  DISPOSITIVO=(window.crypto&&crypto.randomUUID)?crypto.randomUUID()
             :'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
  try{localStorage.setItem('bc_dev',DISPOSITIVO);}catch(e){}
}
function _setAutor(n){AUTOR=String(n||'').trim().slice(0,60);
  if(AUTOR)localStorage.setItem('bc_autor',AUTOR);else localStorage.removeItem('bc_autor');pintarAutor();}
function pintarAutor(){const e=document.getElementById('quien'); if(e)e.textContent=AUTOR||'Identifícate';}
// Misma normalización que el servidor: mayúsculas y tildes no distinguen.
const _nomClave=n=>String(n||'').replace(/\s+/g,' ').trim().toUpperCase()
  .replace(/[ÁÀÄÂ]/g,'A').replace(/[ÉÈËÊ]/g,'E').replace(/[ÍÌÏÎ]/g,'I')
  .replace(/[ÓÒÖÔ]/g,'O').replace(/[ÚÙÜÛ]/g,'U').replace(/Ñ/g,'N');
/** El padrón manda sobre lo guardado en el teléfono, igual que en el escritorio. */
function _sincronizarAutor(d){
  const yo=(d&&d.yo)||'', lista=(d&&d.usuarios)||[];
  if(yo){if(yo!==AUTOR)_setAutor(yo);return;}
  if(!AUTOR)return;
  const mismo=lista.find(u=>_nomClave(u.nombre)===_nomClave(AUTOR));
  if(mismo&&!mismo.mio)_setAutor('');   // es de otro equipo: aquí ya no se puede firmar
}
/** El selector de identidad: el padrón, no un campo libre. */
async function pedirAutor(){
  document.getElementById('sheetHd').innerHTML=
    `<div style="font-weight:700">¿Quién usa la app?</div><button class="close" onclick="closeSheet()">×</button>`;
  document.getElementById('sheetBd').innerHTML='<p style="color:var(--ac-muted)">Leyendo los nombres registrados…</p>';
  document.getElementById('sheetBg').classList.add('show');document.getElementById('sheet').classList.add('show');
  let d=null;
  try{d=await jsonp('getAutores',{dispositivo:DISPOSITIVO});}
  catch(e){if(authErr(e))return;}
  if(d)_sincronizarAutor(d);
  const otros=((d&&d.usuarios)||[]).filter(u=>!u.mio);
  const mio=((d&&d.usuarios)||[]).find(u=>u.mio);
  document.getElementById('sheetBd').innerHTML=`
    <p style="font-size:.8rem;color:var(--ac-muted);margin-top:0">Tu nombre queda anotado en <b>cada cambio</b> y no se borra de la bitácora. Cada nombre se reserva para un equipo.</p>
    ${d?'':'<div class="aviso warn">No se pudo leer la lista de nombres. Puedes escribir el tuyo igual.</div>'}
    ${mio?`<div class="aviso" style="background:#e4f5ec;border-color:#bfe5d0;color:#14663f">En este teléfono eres <b>${mio.nombre}</b>.</div>`:''}
    ${otros.length?`<div style="font-size:.72rem;color:var(--ac-muted);font-weight:600;margin:10px 0 4px">NOMBRES YA TOMADOS</div>
      <p style="font-size:.76rem;color:var(--ac-muted);margin:0 0 8px">Están apartados para otro equipo. Si alguno es tuyo y cambiaste de teléfono, pásalo desde el panel de escritorio con la contraseña.</p>
      ${otros.map(u=>`<div class="vis"><b>${u.nombre}</b> <span style="color:var(--ac-muted);font-size:.76rem">· en otro dispositivo</span></div>`).join('')}`:''}
    <label style="font-size:.72rem;color:var(--ac-muted);font-weight:600">Tu nombre</label>
    <input id="idNom" maxlength="60" value="${(AUTOR||'').replace(/"/g,'&quot;')}" placeholder="Tu nombre"/>
    <div id="idErr" style="color:var(--ac-danger);font-size:.8rem;min-height:14px"></div>
    <button class="acb go" onclick="guardarAutor(this)">Identificarme</button>`;
  const i=document.getElementById('idNom'); if(i){i.focus();i.select();}
  return false;   // identificarse es asíncrono: la acción que lo pidió no continúa
}
async function guardarAutor(btn){
  const nombre=(document.getElementById('idNom').value||'').trim().slice(0,60);
  const err=document.getElementById('idErr');err.textContent='';
  if(!nombre){err.textContent='Escribe un nombre.';return;}
  btn.disabled=true;const t=btn.textContent;btn.textContent='…';
  let r;
  try{r=await _enviar('claimAutor',{nombre,autor:nombre});}
  catch(e){
    btn.disabled=false;btn.textContent=t;
    if(authErr(e))return;
    err.textContent=String(e)==='nombre-tomado'
      ? '«'+nombre+'» ya está tomado por otro equipo. Escoge otro, o pásalo a este teléfono desde el panel de escritorio.'
      : 'No se pudo guardar: '+e;
    return;
  }
  _setAutor((r&&r.nombre)||nombre);
  closeSheet();
}
function exigirAutor(){if(AUTOR)return true;pedirAutor();return false;}
/** El envío crudo. Lo usa claimAutor, que es justo la acción que todavía no tiene autor. */
async function _enviar(action,data={}){
  const r=await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action,token:TOKEN,autor:AUTOR,dispositivo:DISPOSITIVO,...data})});
  const j=await r.json();if(!j.ok)throw j.error;return j.data;}
async function post(action,data={}){
  if(!exigirAutor())throw 'sin-autor';
  return _enviar(action,data);}
function authErr(e){
  if(String(e)==='no-auth'){TOKEN='';localStorage.removeItem('ac_token');gate('login');return true;}
  // El nombre con el que se firmó está apartado para otro equipo. Sin esto el móvil
  // enseñaba «Error: autor-de-otro» y dejaba el nombre inservible guardado para siempre.
  if(String(e)==='autor-de-otro'){
    alert('El cambio no se guardó.\n\n«'+AUTOR+'» está reservado para otro dispositivo, así que desde este teléfono no se puede firmar con ese nombre.\n\nIdentifícate con tu propio nombre.');
    _setAutor('');pedirAutor();return true;
  }
  return false;}

let MODE='login';
function gate(m){MODE=m;document.getElementById('app').style.display='none';document.getElementById('gate').classList.add('show');
  document.getElementById('gt').textContent=m==='setup'?'Crear contraseña':'Acceso';
  document.getElementById('gs').textContent=m==='setup'?'Primera vez: define la contraseña.':'Ingresa la contraseña.';
  document.getElementById('gp2').style.display=m==='setup'?'block':'none';document.getElementById('gb').textContent=m==='setup'?'Crear y entrar':'Entrar';
  document.getElementById('gp').value='';document.getElementById('gp2').value='';document.getElementById('ge').textContent='';}
function showApp(){document.getElementById('gate').classList.remove('show');document.getElementById('app').style.display='block';}
/* ───────── las vistas y el módulo que las paga ─────────
 * Que una vista se esconda es cortesía: el servidor ya rechaza las acciones del módulo
 * que no se contrató. Pero ofrecer algo que al tocarlo contesta «ese módulo no está
 * activo» es una mala primera impresión, y abrir en una vista que no carga deja al
 * dueño fuera de su propia app sin saber por qué. */
const VISTAS=[
  {v:'cuentas',  b:'segCta', box:'vCuentas',  mod:'financiero'},
  {v:'acceso',   b:'segAcc', box:'vAcceso',   mod:'acceso'},
  {v:'comprob',  b:'segCmp', box:'vComprob',  mod:'financiero'},
  {v:'registro', b:'segReg', box:'vRegistro', mod:'financiero'}
];
let MODULOS=null, VISIBLES=[], VISTA='';
function hayModulo(m){
  // Sin lista no se esconde nada: que falte un dato no puede dejar a nadie sin su panel.
  const mods=(Array.isArray(MODULOS)&&MODULOS.length)?MODULOS:null;
  return !mods||mods.indexOf(m)>=0;
}
async function boot(){let st;try{st=await jsonp('getAuthState');}catch(e){st={hasPassword:false};}
  if(!st.hasPassword){gate('setup');return;} if(!TOKEN){gate('login');return;}
  MODULOS=st.modulos||null; pintarAutor();
  VISIBLES=VISTAS.filter(x=>hayModulo(x.mod));
  VISTAS.forEach(x=>{const b=document.getElementById(x.b);
    if(b)b.style.display=VISIBLES.indexOf(x)>=0?'':'none';});
  if(VISIBLES.length>1)document.getElementById('seg').style.display='flex';
  if(!VISIBLES.length){
    document.getElementById('vCuentas').innerHTML=
      '<div class="aviso warn">Esta comunidad no tiene ningún módulo con vista en el teléfono. Entra desde el panel de escritorio.</div>';
    showApp();return;
  }
  try{await verVista(VISIBLES[0].v);showApp();}
  catch(e){if(!authErr(e))gate('login');}}

async function verVista(v){
  VISTA=v;
  VISTAS.forEach(x=>{
    document.getElementById(x.box).style.display=x.v===v?'block':'none';
    const b=document.getElementById(x.b); if(b)b.className=x.v===v?'on':'';
  });
  window.scrollTo({top:0});
  if(v==='cuentas')  return load();
  if(v==='acceso')   return cargarAcceso();
  if(v==='comprob')  return cargarComprob();
  if(v==='registro') return cargarRegistro();
}
const _esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const hoyISO=()=>new Date().toISOString().slice(0,10);
/* Las cuentas bancarias de la asociación. Se piden una vez: la lista cambia poco y el
 * selector sale en el pago manual y en cada comprobante. Si falla, el selector queda
 * vacío y el servidor pone la cuenta de cobro, que es lo correcto por defecto. */
let BANCOS=null;
async function bancos(){
  if(BANCOS)return BANCOS;
  try{const d=await jsonp('getCuentasData');BANCOS=(d.cuentas||[]).filter(c=>c.activa);}
  catch(e){BANCOS=[];}
  return BANCOS;
}
function optsBanco(sel){
  return (BANCOS||[]).map(c=>`<option value="${_esc(c.id)}"${c.id===sel?' selected':''}>${_esc(c.nombre)}${c.esCobro?' · cobro':''}</option>`).join('');
}

/* ───────── acceso ─────────
 * Las mismas cuatro vistas del escritorio. La bitácora es la que más se mira desde el
 * teléfono, así que abre en ella; pero cargar un contacto o dejar un permiso también
 * pasa estando de pie frente a alguien, no sentado en un escritorio.
 */
let ACC=null, ACC_VISTA='visitas';
async function cargarAcceso(force){
  const box=document.getElementById('vAcceso');
  if(ACC&&!force){pintarAcceso();return;}
  box.innerHTML='<p style="color:var(--ac-muted)">Cargando…</p>';
  try{ACC=await jsonp('getAcceso');}
  catch(e){if(authErr(e))return; box.innerHTML='<div class="aviso err">No se pudo cargar: '+e+'</div>';return;}
  pintarAcceso();
}
const ACC_EST={autorizada:['ok','autorizada'],preautorizada:['ok','preautorizada'],
  rechazada:['red','rechazada'],pendiente:['warn','pendiente'],'sin-respuesta':['warn','sin respuesta']};
function accVista(v){ACC_VISTA=v;pintarAcceso();window.scrollTo({top:0});}
function accUnidad(){return (ACC&&ACC.unidad)||'unidad';}
/** Nombre legible de una unidad. getAcceso trae su propio padrón, así que esto funciona
 *  también donde el módulo financiero no está contratado y getPropietarios se rechaza. */
function accNombreDe(clave){
  const p=((ACC&&ACC.unidades)||[]).find(x=>x.clave===clave);
  return p?((p.lote?p.lote+' · ':'')+(p.nombre||clave)):clave;
}
function accOptsUnidad(sel){
  const ps=((ACC&&ACC.unidades)||[]).slice()
    .sort((a,b)=>String(a.lote||a.clave).localeCompare(String(b.lote||b.clave),'es',{numeric:true}));
  const hay=ps.some(p=>p.clave===sel);
  return (sel&&!hay?`<option value="${_esc(sel)}" selected>${_esc(sel)}</option>`:'')
    +ps.map(p=>`<option value="${_esc(p.clave)}"${p.clave===sel?' selected':''}>${_esc(accNombreDe(p.clave))}</option>`).join('');
}
/** dd/mm/aaaa a partir del AAAA-MM-DD que edita el formulario. */
function accFecha(iso){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||''));return m?`${m[3]}/${m[2]}/${m[1]}`:'—';}

function pintarAcceso(){
  const d=ACC;
  const avisos=(d.avisos||[]).map(a=>`<div class="aviso ${a.tipo==='error'?'err':'warn'}">${_esc(a.texto)}</div>`).join('');
  const sg=(v,t)=>`<button class="${ACC_VISTA===v?'on':''}" onclick="accVista('${v}')">${t}</button>`;
  const cuerpo=ACC_VISTA==='contactos'?accContactosHTML()
             :ACC_VISTA==='permisos' ?accPermisosHTML()
             :ACC_VISTA==='garita'   ?accGaritaHTML()
             :accVisitasHTML();
  document.getElementById('vAcceso').innerHTML=`${avisos}
    <div class="seg sub" id="segAccSub">${sg('visitas','Bitácora')}${sg('contactos','Contactos')}${sg('permisos','Permisos')}${sg('garita','Garita')}</div>
    ${cuerpo}
    <button class="acb" onclick="cargarAcceso(true)">Actualizar</button>`;
}
function accVisitasHTML(){
  const d=ACC,vs=d.visitas||[];

  }).join(''):'<p style="color:var(--ac-muted)">Todavía no ha entrado nadie.</p>';

/* ── contactos: a quién se le pregunta por WhatsApp cuando llega una visita ── */
function accContactosHTML(){
  const d=ACC,U=accUnidad(),porClave={};
  (d.contactos||[]).forEach(c=>{(porClave[c.clave]=porClave[c.clave]||[]).push(c);});
  const claves=Object.keys(porClave).sort();
  const filas=claves.length?claves.map(k=>{
    const cs=porClave[k],autorizan=cs.filter(c=>c.activo&&c.autoriza).length;
    return `<div class="vis" onclick="accAbrirUnidad('${_esc(k)}')">
      <div class="l1"><b>${_esc(accNombreDe(k))}</b><span class="pill ${autorizan?'ok':'warn'}">${autorizan} de ${d.maxContactos}</span></div>
      <div class="l2">${cs.map(c=>_esc(c.nombre)+(c.activo&&c.autoriza?'':' (no autoriza)')).join(' · ')}</div></div>`;
  }).join(''):`<p style="color:var(--ac-muted);font-size:.85rem">Todavía no hay contactos de acceso cargados.
      Mientras tanto las visitas se preguntan al celular del padrón —que es el de <b>cobro</b>,
      no necesariamente el de quien está en la casa a las nueve de la noche.</p>`;

    ${filas}

      <div class="dias" style="margin-top:8px">${sin.map(s=>
        `<button class="acb" style="margin:0;flex:0 0 auto;width:auto;padding:7px 11px;font-size:.82rem"
           onclick="accFormContacto('${_esc(s.clave)}','')">+ ${_esc(s.clave)}</button>`).join('')}</div></details>`:''}
    <button class="acb go" onclick="accFormContacto('','')">+ Agregar contacto</button>`;
}
function accAbrirUnidad(clave){
  const d=ACC,cs=(d.contactos||[]).filter(c=>c.clave===clave);
  const autorizan=cs.filter(c=>c.activo&&c.autoriza).length;
  abrirHoja(accNombreDe(clave),`Contactos de acceso · ${autorizan} de ${d.maxContactos} autorizan`,
    (cs.length?cs.map(c=>`<div class="vis">
        <div class="l1"><b>${_esc(c.nombre)}</b><span class="pill ${c.activo&&c.autoriza?'ok':'warn'}">${c.autoriza?'autoriza':'sólo avisos'}</span></div>
        <div class="l2">${_esc(c.rol)} · ${_esc(c.celular||'sin celular')}${c.activo?'':' · inactivo'}</div>
        <div class="l2" style="margin-top:6px">
          <button class="lnk" onclick="accFormContacto('${_esc(clave)}','${_esc(c.id)}')">Editar</button>
          &nbsp;&nbsp;<button class="lnk del" onclick="accBorrarContacto('${_esc(c.id)}',this)">Quitar</button></div></div>`).join('')

const _g=i=>((document.getElementById(i)||{}).value||'').trim();
const _ck=i=>!!(document.getElementById(i)||{}).checked;
async function accGuardarContacto(id,btn){
  const err=document.getElementById('acErr');
  const contacto={id:id,clave:_g('ac_clave'),nombre:_g('ac_nombre'),celular:_g('ac_cel'),
    rol:_g('ac_rol'),orden:Number(_g('ac_orden'))||1,notas:_g('ac_notas'),

  if(!contacto.clave||!contacto.nombre){err.textContent='La unidad y el nombre no pueden quedar vacíos.';return;}

async function accBorrarContacto(id,btn){
  if(!confirm('¿Quitar este contacto de acceso?\n\nDeja de recibir las consultas de visita de su unidad. Las visitas ya registradas no se tocan.'))return;
  await _accEscribir(btn,document.getElementById('acErr'),()=>post('eliminarContacto',{id}));
}
/** Escribe, cierra la hoja y repinta. Un fallo deja el botón vivo y el mensaje puesto. */
async function _accEscribir(btn,err,fn){
  if(err)err.textContent='';
  btn.disabled=true;const t=btn.textContent;btn.textContent='…';
  try{await fn();closeSheet();await cargarAcceso(true);}
  catch(e){btn.disabled=false;btn.textContent=t;
    if(!authErr(e)){if(err)err.textContent='Error: '+e;else alert('Error: '+e);}}
}

async function accGuardarPermiso(id,btn){
  const err=document.getElementById('auErr');
  const dias=[...document.querySelectorAll('.au_dia')].filter(x=>x.checked).map(x=>x.value);
  const autorizacion={id:id,clave:_g('au_clave'),visitante:_g('au_vis'),cedula:_g('au_ced'),
    desde:_g('au_desde'),hasta:_g('au_hasta'),recurrente:_ck('au_rec'),dias:dias.join(','),
    creadoPor:_g('au_por'),activo:_ck('au_activo'),notas:_g('au_notas')};
  if(!autorizacion.clave||!autorizacion.visitante){err.textContent='La unidad y el nombre del visitante no pueden quedar vacíos.';return;}
  if(autorizacion.recurrente&&!dias.length){err.textContent='Una autorización que se repite necesita al menos un día.';return;}
  await _accEscribir(btn,err,()=>post('guardarAutorizacion',{autorizacion}));
}
async function accBorrarPermiso(id,btn){
  if(!confirm('¿Eliminar esta autorización?\n\nA partir de ahora esa visita vuelve a preguntarse por WhatsApp cada vez.'))return;
  await _accEscribir(btn,document.getElementById('auErr'),()=>post('eliminarAutorizacion',{id}));
}

async function accionVisita(que,id,btn){
  const err=document.getElementById('mvErr');err.textContent='';
  btn.disabled=true;const t=btn.textContent;btn.textContent='…';
  try{
    if(que==='salida')      await post('anotarSalida',{id});
    else if(que==='cerrar'){
      if(!confirm('Cerrar como «sin respuesta»: nadie contestó y no consta que entrara.')){
        btn.disabled=false;btn.textContent=t;return;}
      await post('cerrarVisita',{id,estado:'sin-respuesta'});
    } else {
      const g=i=>(document.getElementById(i).value||'').trim();
      await post('corregirVisita',{id,datos:{visitante:g('mv_nom'),cedula:g('mv_ced')}});
    }
    closeSheet();await cargarAcceso(true);
  }catch(e){btn.disabled=false;btn.textContent=t;if(!authErr(e))err.textContent='Error: '+e;}
}
document.getElementById('gf').addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('ge');err.textContent='';
  const pwd=document.getElementById('gp').value;
  try{let r; if(MODE==='setup'){if(pwd!==document.getElementById('gp2').value){err.textContent='No coinciden.';return;} r=await post('setPassword',{nueva:pwd});}
    else{r=await post('verifyPassword',{password:pwd}); if(!r.ok){err.textContent='Contraseña incorrecta.';return;}}
    // boot() y no load(): hay que volver a leer los módulos para saber qué vistas
    // enseñar. Con load() a secas se entraba siempre por Cuentas, contratadas o no.
    TOKEN=r.token;localStorage.setItem('ac_token',TOKEN);await boot();}catch(ex){err.textContent='Error: '+ex;}});
function logout(){TOKEN='';localStorage.removeItem('ac_token');gate('login');}

let CUENTAS=[], CUENTAS_STALE=false;
const pill=e=>e==='Al día'?'<span class="pill ok">Al día</span>':e==='Pendiente'?'<span class="pill warn">Pendiente</span>':'<span class="pill red">Moroso</span>';
async function load(){
  // Aplicar un comprobante o registrar un pago cambia los saldos. Sin esto se volvía a
  // Cuentas y se leía la cartera de antes del pago, que es peor que no verla.
  if(CUENTAS.length&&!CUENTAS_STALE){draw();return;}
  const d=await jsonp('getDashboard'); CUENTAS=d.cuentas; CUENTAS_STALE=false;
  const con=CUENTAS.filter(c=>c.saldoConMora>0.009).length, cartera=CUENTAS.reduce((a,c)=>a+c.saldoConMora,0);
  document.getElementById('summary').innerHTML=
    `<div class="card"><div class="label">Por cobrar</div><div class="val" style="color:var(--ac-coral)">${money(cartera)}</div></div>
     <div class="card"><div class="label">Cuentas con saldo</div><div class="val">${con} / ${CUENTAS.length}</div></div>`;
  draw();
}
function draw(){const q=document.getElementById('q').value.toLowerCase();
  const rows=CUENTAS.filter(c=>!q||c.nombre.toLowerCase().includes(q)||String(c.lote).toLowerCase().includes(q)).sort((a,b)=>b.saldoConMora-a.saldoConMora);
  document.getElementById('list').innerHTML=rows.map(c=>`<div class="row" onclick="openSheet('${c.clave}')">
    <div class="lote">${c.lote}</div><div class="nm"><b>${c.nombre}</b><span>${c.residencial}</span></div>
    <div class="sal"><b>${money(c.saldoConMora)}</b><div>${pill(c.estado)}</div></div></div>`).join('')||'<p class="muted">Sin resultados.</p>';}
document.getElementById('q').oninput=draw;
// Explicación de cada mes con los criterios de cobro aprobados por la Junta.
// En móvil no hay hover, así que se abre tocando la fila.
function _expMes(e,b,esUltimo){
  const L=[];
  if(b.cuota) L.push(`<b>Cuota</b> ${money(b.cuota)} — vence el último día de ${b.label}, sin período de gracia.`);
  if(b.condonada) L.push(`<b>Mora</b> — recargo condonado por la administración.`);
  else if(b.mora>0.009) L.push(`<b>Mora</b> ${money(b.mora)} — 10% de la cuota íntegra (${money(b.cuota)}) porque al cerrar ${b.label} quedaban ${money(b.descubierto||0)} sin cubrir. Cargo único; la mora no genera mora.`);
  else if(b.cuota&&esUltimo) L.push(`<b>Mora</b> — ${b.label} es el mes en curso: aún no vence.`);
  else if(b.cuota&&b.ym&&b.ym<'2026-04') L.push(`<b>Mora</b> — la mora rige desde abril 2026.`);
  else if(b.cuota) L.push(`<b>Mora</b> — sin recargo: la cuota de ${b.label} quedó cubierta.`);
  if(b.saldoIni!==undefined&&b.pagado){
    const a=[];
    if(b.apVencidas>0.009)   a.push(`${money(b.apVencidas)} a cuotas vencidas`);
    if(b.apMesEnCurso>0.009) a.push(`${money(b.apMesEnCurso)} a la cuota de ${b.label}`);
    if(b.apMora>0.009)       a.push(`${money(b.apMora)} a recargos por mora`);
    if(b.apCredito>0.009)    a.push(`${money(b.apCredito)} a saldo a favor`);
    L.push(`<b>Pagado</b> ${money(b.pagado)} — se aplicó así: ${a.join(', ')}. El orden es: cuotas vencidas → cuota del mes en curso → recargos por mora.`);
  }
  if(b.saldoIni!==undefined) L.push(`<b>Saldo</b> = ${money(b.saldoIni)} anterior + ${money(b.cuota)} cuota + ${money(b.mora||0)} recargo − ${money(b.pagado)} pagos = ${money(b.saldo)}.`);
  return L.join('<br>');
}
function expMes(tr){const n=tr.nextElementSibling;if(n&&n.classList.contains('exp'))n.style.display=n.style.display==='table-row'?'none':'table-row';}
/* El detalle de una cuenta. Se pide al servidor con getEstadoCuenta en vez de usar la
 * fila del tablero: condonar una mora o registrar un pago obliga a recalcular, y
 * repintar con los números viejos enseñaría un cambio que no ocurrió. */
let EST=null, PG_ULTIMO=null;
async function openSheet(clave){
  const base=CUENTAS.find(c=>c.clave===clave);
  abrirHoja(base?base.nombre:clave,base?`${_esc(base.residencial)} · Lote ${_esc(base.lote)}`:'',
    '<p style="color:var(--ac-muted)">Calculando el estado de cuenta…</p>');
  await bancos();
  try{EST=await jsonp('getEstadoCuenta',{clave});}
  catch(e){if(authErr(e))return;
    document.getElementById('sheetBd').innerHTML='<div class="aviso err">No se pudo cargar: '+_esc(e)+'</div>';return;}
  pintarEstado();
}
function pintarEstado(){
  const e=EST;if(!e||!e.mensual)return;
  const color=e.saldoConMora>0.009?(e.diasVencido>0?'var(--ac-danger)':'var(--ac-warn)'):'var(--ac-ok)';
  const all=!!e.moraCondonAll;
  document.getElementById('sheetHd').innerHTML=`<div><div style="font-weight:700">${_esc(e.nombre)}</div>
    <div style="font-size:.78rem;color:var(--ac-muted)">${_esc(e.residencial)} · Lote ${_esc(e.lote)} · Cuota ${money(e.cuota)}</div></div>
    <button class="close" onclick="closeSheet()">×</button>`;
  document.getElementById('sheetBd').innerHTML=`${_pgAviso()}
    <table><thead><tr><th>Mes</th><th class="n">Cuota</th><th class="n">Mora</th><th class="n">Pagado</th><th class="n">Saldo total</th></tr></thead>
    <tbody>${e.mensual.map((b,i,arr)=>`<tr onclick="expMes(this)" style="cursor:pointer"><td>${b.label}</td><td class="n">${b.cuota?money(b.cuota):'—'}</td>
      <td class="n" style="${b.mora>0.009?'color:var(--ac-coral)':''}">${b.condonada?'condon.':(b.mora>0.009?money(b.mora):'—')}</td>
      <td class="n">${b.pagado?money(b.pagado):(b.cuota?'0.00':'—')}</td>
      <td class="n" style="font-weight:600;${b.saldo>0.009?'color:var(--ac-danger)':b.saldo<-0.009?'color:var(--ac-ok)':''}">${money(b.saldo)}</td></tr>
      <tr class="exp" style="display:none"><td colspan="5" style="font-size:.72rem;line-height:1.6;color:var(--ac-muted);background:#f7f9fa;padding:8px 10px">${_expMes(e,b,i===arr.length-1)}</td></tr>`).join('')}</tbody></table>
    <div class="tot"><b>SALDO TOTAL</b><b style="color:${color}">${money(e.saldoNeto)}</b></div>
    <div style="color:var(--ac-muted);font-size:.7rem;margin-top:8px">Toca cualquier mes para ver cómo se calculó.</div>
    <div id="ctaErr" style="color:var(--ac-danger);font-size:.8rem;min-height:14px"></div>
    <button class="acb go" onclick="mail('${_esc(e.clave)}')" ${e.email?'':'disabled'}>Enviar estado de cuenta por correo</button>
    <button class="acb" onclick="pgForm(this)">＋ Registrar pago</button>
    ${(e.moraCargada>0.009||all)?`<button class="acb" onclick="condonarMora(${!all},this)">${all?'↩ Reactivar mora':'Condonar mora'}</button>`:''}
    <div id="pgBox" style="display:none;margin-top:12px;border-top:1px dashed var(--ac-border);padding-top:12px">
      <div style="font-weight:600">Registrar pago manual</div>
      <p style="font-size:.76rem;color:var(--ac-muted);margin:2px 0 10px">Para pagos verificados en la banca en
        línea, sin comprobante por correo. Al guardarlo se emite la <b>constancia en PDF</b>.</p>
      <div class="dos">
        <div><label class="lb">Fecha</label><input type="date" id="pg_fecha" value="${hoyISO()}" max="${hoyISO()}"/></div>
        <div><label class="lb">Monto (B/.)</label><input type="number" id="pg_monto" step="0.01" min="0" placeholder="0.00" inputmode="decimal"/></div>
      </div>
      <label class="lb">¿A qué cuenta entró?</label><select id="pg_cuenta">${optsBanco(((BANCOS||[]).find(x=>x.esCobro)||{}).id||'')}</select>
      <label class="lb">Referencia (opcional)</label><input id="pg_ref" placeholder="Nº de transacción / ACH"/>
      <button class="acb go" onclick="pgGuardar(this)">Guardar pago</button>
    </div>`;
}
/** La constancia del pago recién registrado. Si Drive falló, el pago quedó igual. */
function _pgAviso(){
  const u=PG_ULTIMO;if(!u||!EST||u.clave!==EST.clave)return '';
  return `<div class="aviso" style="background:#e4f5ec;border-color:#bfe5d0;color:#14663f">
    ✓ Pago de ${money(u.monto)} registrado con fecha ${accFecha(u.fecha)}<br>
    ${u.voucher?`<a href="${_esc(u.voucher.url)}" target="_blank" style="font-weight:700;color:#14663f">📄 Ver constancia${u.voucher.numero?' · '+_esc(u.voucher.numero):''}</a>`
      :'El pago quedó registrado, pero no se pudo emitir la constancia.'}</div>`;
}
function pgForm(btn){
  const b=document.getElementById('pgBox');
  b.style.display=b.style.display==='none'?'block':'none';
  if(b.style.display==='block')b.scrollIntoView({block:'nearest'});
}
async function pgGuardar(btn){
  const err=document.getElementById('ctaErr');err.textContent='';
  const fecha=_g('pg_fecha'),monto=+_g('pg_monto'),ref=_g('pg_ref'),cuenta=_g('pg_cuenta');
  if(!(monto>0)){err.textContent='Indica un monto válido.';return;}
  if(!fecha){err.textContent='Indica la fecha del pago.';return;}
  btn.disabled=true;const t=btn.textContent;btn.textContent='Guardando…';
  try{
    // La fecha a mediodía para que ninguna zona horaria la corra al día anterior.
    const r=await post('registrarPago',{pago:{clave:EST.clave,monto,fecha:fecha+'T12:00:00',
      referencia:ref,origen:'manual',cuenta,notas:'Registro manual (banca en línea)',generarVoucher:true}});
    PG_ULTIMO={clave:EST.clave,monto,fecha,
      voucher:(r&&r.voucherUrl)?{url:r.voucherUrl,numero:r.voucherNumero||''}:null};
    CUENTAS_STALE=true;
    EST=await jsonp('getEstadoCuenta',{clave:EST.clave});
    pintarEstado();
  }catch(e){btn.disabled=false;btn.textContent=t;if(!authErr(e))err.textContent='Error: '+e;}
}
async function condonarMora(condonar,btn){
  if(!confirm(condonar?'¿Condonar TODA la mora de este propietario?':'¿Reactivar toda la mora de este propietario?'))return;
  const err=document.getElementById('ctaErr');err.textContent='';
  btn.disabled=true;const t=btn.textContent;btn.textContent='…';
  try{
    await post('setMoraCondon',{clave:EST.clave,mes:'ALL',condonar});
    CUENTAS_STALE=true;
    EST=await jsonp('getEstadoCuenta',{clave:EST.clave});
    pintarEstado();
  }catch(e){btn.disabled=false;btn.textContent=t;if(!authErr(e))err.textContent='Error: '+e;}
}
function closeSheet(){document.getElementById('sheetBg').classList.remove('show');document.getElementById('sheet').classList.remove('show');}
/** La hoja de abajo, que es el modal del teléfono. Título, subtítulo y cuerpo. */
function abrirHoja(titulo,sub,cuerpo){
  document.getElementById('sheetHd').innerHTML=`<div><div style="font-weight:700">${_esc(titulo)}</div>
    ${sub?`<div style="font-size:.78rem;color:var(--ac-muted)">${sub}</div>`:''}</div>
    <button class="close" onclick="closeSheet()">×</button>`;
  document.getElementById('sheetBd').innerHTML=cuerpo;
  document.getElementById('sheetBg').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  document.getElementById('sheet').scrollTop=0;
}
async function mail(clave){try{const r=await post('enviarEstado',{clave});alert(r.enviado?'Enviado':'No enviado');}catch(e){if(!authErr(e))alert('Error: '+e);}}

/* ───────── comprobantes por email ─────────
 * La vista que más gana con estar en el teléfono: llega el aviso, se revisa el monto y
 * la cuenta, y el pago queda aplicado sin esperar a sentarse. Nada se aplica solo —
 * confirmar es siempre una decisión de una persona.
 */
let CMP=null, CMP_PROPS=null;
async function cargarComprob(force){
  const box=document.getElementById('vComprob');
  if(CMP&&!force){pintarComprob();return;}
  box.innerHTML='<p style="color:var(--ac-muted)">Cargando…</p>';
  try{
    const [all,props]=await Promise.all([
      jsonp('getComprobantes',{}),
      CMP_PROPS?Promise.resolve(CMP_PROPS):jsonp('getPropietarios')]);
    CMP=all;CMP_PROPS=props;await bancos();
  }catch(e){if(authErr(e))return;box.innerHTML='<div class="aviso err">No se pudo cargar: '+_esc(e)+'</div>';return;}
  pintarComprob();
}
function optsProp(sel){
  return (CMP_PROPS||[]).slice()
    .sort((a,b)=>String(a.residencial).localeCompare(String(b.residencial))||String(a.lote).localeCompare(String(b.lote),'es',{numeric:true}))
    .map(p=>`<option value="${_esc(p.clave)}"${p.clave===sel?' selected':''}>${_esc(p.residencial)} · L${_esc(p.lote)} · ${_esc(p.nombre)}</option>`).join('');
}
/** La señal de si el dinero entró a una cuenta de la asociación. La manda el servidor. */
function verifBadge(v){
  if(!v||!v.nivel)return '';
  const t={ok:'✓ Cuenta Aires de Chicá',warn:'⚠ Verificar cuenta',bad:'⚠ Cuenta no coincide'}[v.nivel]||'⚠ Verificar cuenta';
  return `<div class="badge ${_esc(v.nivel)}" style="margin-top:4px">${t}</div>`;
}
function pintarComprob(){
  const all=CMP||[];
  const pend=all.filter(c=>c.estado==='pendiente');
  const desc=all.filter(c=>c.estado==='descartado');
  const apl =all.filter(c=>c.estado==='aplicado').slice(0,30);
  const rech=all.filter(c=>c.estado==='rechazado').slice(0,30);
  const adj=c=>c.adjuntoUrl?`<a href="${_esc(c.adjuntoUrl)}" target="_blank" style="font-size:.78rem;font-weight:600;color:var(--ac-teal)">📎 Ver comprobante</a>`
                           :'<span style="font-size:.74rem;color:var(--ac-muted)">sin adjunto</span>';
  const conf=c=>(c.metodo==='email'||c.metodo==='lote+nombre')?'ok':(c.metodo==='sin-match'?'red':'warn');
  const detectada=c=>(c.verif&&c.verif.cuentaId)||((BANCOS||[]).find(x=>x.esCobro)||{}).id||'';
  const tarjetas=pend.length?pend.map(c=>`<div class="vis" id="cmp_${_esc(c.id)}">
      <div class="l1"><b>${_esc(c.nombre||'—')}</b><span class="pill ${conf(c)}">${_esc(c.metodo||'')}</span></div>
      <div class="l2">${_esc(c.remitente||'')} · ${_esc(c.fecha||'')}</div>
      <div class="l2" style="white-space:normal;margin-top:4px">${_esc(c.asunto||'(sin asunto)')}</div>
      <div class="l2">${adj(c)}</div>${verifBadge(c.verif)}
      ${c.referencia?`<div class="l2">Ref: ${_esc(c.referencia)}</div>`:''}
      <div style="margin-top:9px">
        <label class="lb">Monto</label><input type="number" step="0.01" min="0" id="cm_m_${_esc(c.id)}" value="${c.monto||''}" placeholder="0.00"/>
        <label class="lb">Aplicar a</label><select id="cm_p_${_esc(c.id)}"><option value="">— asignar —</option>${optsProp(c.clave||'')}</select>
        <label class="lb">Entró a</label><select id="cm_b_${_esc(c.id)}">${optsBanco(detectada(c))}</select>
      </div>
      <button class="acb go" onclick="cmpPrevio('${_esc(c.id)}',this)">Confirmar</button>
      <button class="acb" style="color:var(--ac-danger)" onclick="cmpRechazar('${_esc(c.id)}',this)">Rechazar</button>
    </div>`).join('')
    :`<p style="color:var(--ac-muted);font-size:.85rem">No hay comprobantes pendientes.
       Pulsa <b>Revisar correo ahora</b> para leer el buzón.</p>`;
  const lista=(t,cs,acc)=>!cs.length?'':`<details><summary>${t} (${cs.length})</summary>${cs.map(c=>`<div class="vis">
      <div class="l1"><b>${_esc(c.nombre||'—')}</b>${c.monto?`<span style="font-weight:700">${money(c.monto)}</span>`:''}</div>
      <div class="l2">${_esc(c.fecha||'')}${c.motivo?' · '+_esc(c.motivo):''}</div>
      <div class="l2">${adj(c)}${acc?' &nbsp; '+acc(c):''}</div></div>`).join('')}</details>`;
  document.getElementById('vComprob').innerHTML=`
    <p style="color:var(--ac-muted);font-size:.8rem;margin-top:0">Los propietarios envían su comprobante por
      correo. El sistema empareja al propietario y lo deja <b>pendiente</b>. Revisa el monto y la cuenta y
      confirma para registrar el pago. <b>Nada se aplica solo.</b></p>
    <button class="acb" onclick="cmpCapturar(this)">Revisar correo ahora</button>
    <div class="flash" id="cmpFlash"></div>
    <div style="margin-top:10px">${tarjetas}</div>
    ${lista('Descartados — sin adjunto o no parecen pago',desc,c=>`<button class="lnk" onclick="cmpAccion('recuperar','${_esc(c.id)}',this)">Recuperar</button>`)}
    ${lista('Aplicados — pagos ya registrados',apl,c=>`<button class="lnk del" onclick="cmpDesaplicar('${_esc(c.id)}',this)">Desaplicar</button>`)}
    ${lista('Rechazados',rech,null)}`;
}
async function cmpCapturar(btn){
  btn.disabled=true;const t=btn.textContent;btn.textContent='Revisando…';
  const fl=document.getElementById('cmpFlash');fl.textContent='';
  try{const r=await post('capturarComprobantes',{});
    await cargarComprob(true);
    const f=document.getElementById('cmpFlash');
    if(f)f.textContent=`${r.nuevos||0} pendiente(s) capturado(s)`+(r.descartados?` · ${r.descartados} descartado(s)`:'')+'.';
  }catch(e){if(!authErr(e))alert('Error: '+e);}
  finally{btn.disabled=false;btn.textContent=t;}
}
/** Antes de aplicar, cómo va a quedar la cuenta. Es la única parte que quien confirma
 *  todavía puede cambiar, así que se enseña entera y no se aplica desde la lista. */
async function cmpPrevio(id,btn){
  const clave=_g('cm_p_'+id),monto=+_g('cm_m_'+id);
  if(!clave)return alert('Asigna una cuenta.');
  if(!(monto>0))return alert('Indica el monto.');
  btn.disabled=true;const t=btn.textContent;btn.textContent='Calculando…';
  let d;
  try{d=await jsonp('previsualizarComprobante',{clave,monto});}
  catch(e){btn.disabled=false;btn.textContent=t;if(!authErr(e))alert('Error: '+e);return;}
  btn.disabled=false;btn.textContent=t;
  const c=(CMP||[]).find(x=>x.id===id)||{};
  const fila=a=>`<tr><td>${_esc(a.label)}</td><td class="n">${money(a.cuota!=null?a.cuota:a.mora)}</td>
    <td class="n" style="font-weight:700;color:var(--ac-teal)">${money(a.aplicado)}</td>
    <td class="n">${a.quedaPendiente>0.009?money(a.quedaPendiente):'saldada ✓'}</td></tr>`;
  const pmD=Number(d.despues&&d.despues.pendienteMes)||0;
  const cierre=!d.cuotaMes?'':(pmD<=0.009
    ? `<div class="aviso" style="background:#eefaf2;border-color:#cfe8d8;color:#14663f">
         <b>✓ La cuota de ${_esc(d.mesActual)} queda cubierta.</b> Al cerrar el mes no generará recargo.</div>`
    : `<div class="aviso warn"><b>Quedan ${money(pmD)} sin cubrir de la cuota de ${_esc(d.mesActual)}.</b>
         Si no se completan antes del cierre, esa cuota generará un recargo de <b>${money(d.moraSiNoCubre)}</b>.</div>`);
  abrirHoja('Así se aplicará',`${_esc(d.nombre)} · L${_esc(d.lote)} · pago ${money(d.monto)}`,`
    ${verifBadge(c.verif)}
    <table><thead><tr><th>Cuota / saldo</th><th class="n">Monto</th><th class="n">Se aplica</th><th class="n">Queda</th></tr></thead>
      <tbody>${(d.aplicacion||[]).length?d.aplicacion.map(fila).join('')
        :'<tr><td colspan="4" style="color:var(--ac-muted)">Este pago no cubre cuotas pendientes; entra completo como crédito a favor.</td></tr>'}
        ${(d.aplicacionMora||[]).map(a=>fila({label:a.label+' · mora',cuota:a.mora,aplicado:a.aplicado,quedaPendiente:a.quedaPendiente})).join('')}</tbody></table>
    ${cierre}
    <div class="tot"><b>Total aplicado</b><b>${money(d.totalAplicado)}</b></div>
    <div class="tot"><span>Saldo con mora</span><b>${money(d.antes.saldoConMora)} → ${money(d.despues.saldoConMora)}</b></div>
    <div id="cmpErr" style="color:var(--ac-danger);font-size:.8rem;min-height:14px"></div>
    <button class="acb go" onclick="cmpAplicar('${_esc(id)}',this)">Aplicar pago</button>
    <button class="acb" onclick="closeSheet()">Cancelar</button>`);
}
async function cmpAplicar(id,btn){
  const clave=_g('cm_p_'+id),monto=+_g('cm_m_'+id),cuenta=_g('cm_b_'+id);
  const err=document.getElementById('cmpErr');err.textContent='';
  btn.disabled=true;btn.textContent='Aplicando…';
  try{await post('resolverComprobante',{id,accion:'aplicar',clave,monto,cuenta});
    closeSheet();CUENTAS_STALE=true;await cargarComprob(true);}
  catch(e){btn.disabled=false;btn.textContent='Aplicar pago';if(!authErr(e))err.textContent='Error: '+e;}
}
async function cmpRechazar(id,btn){
  if(!confirm('¿Rechazar este comprobante? No se registrará ningún pago.'))return;
  await cmpAccion('rechazar',id,btn);
}
async function cmpDesaplicar(id,btn){
  if(!confirm('¿Desaplicar este comprobante?\n\nSe eliminará el pago que registró y volverá a «Pendientes».'))return;
  CUENTAS_STALE=true;
  await cmpAccion('desaplicar',id,btn);
}
async function cmpAccion(accion,id,btn){
  btn.disabled=true;const t=btn.textContent;btn.textContent='…';
  try{await post('resolverComprobante',{id,accion});await cargarComprob(true);}
  catch(e){btn.disabled=false;btn.textContent=t;if(!authErr(e))alert('Error: '+e);}
}

/* ───────── registro de cambios ─────────
 * Sólo de lectura, aquí y en el escritorio: la bitácora no se edita ni se borra desde
 * ningún panel. En el teléfono sirve para responder «¿quién tocó esto?» sin ir a una
 * computadora. La descarga a Excel se queda en el escritorio.
 */
let REG=null;
async function cargarRegistro(force){
  const box=document.getElementById('vRegistro');
  if(REG&&!force){pintarRegistro();return;}
  if(!REG)box.innerHTML='<p style="color:var(--ac-muted)">Cargando…</p>';
  let d;
  try{d=await jsonp('getRegistro',{desde:_g('rg_desde'),hasta:_g('rg_hasta'),autor:_g('rg_autor'),
      accionFiltro:_g('rg_accion'),q:_g('rg_q'),limite:400});}
  catch(e){if(authErr(e))return;box.innerHTML='<div class="aviso err">No se pudo cargar: '+_esc(e)+'</div>';return;}
  REG=d;pintarRegistro();
}
const REG_MES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function pintarRegistro(){
  const d=REG,f=d.filas||[];
  const dias=[],porDia={};
  f.forEach(r=>{if(!porDia[r.ymd]){porDia[r.ymd]=[];dias.push(r.ymd);}porDia[r.ymd].push(r);});
  const dLbl=ymd=>{const p=String(ymd).split('-');return p[2]?`${+p[2]} de ${REG_MES[+p[1]-1]} ${p[0]}`:ymd;};
  const cuerpo=f.length?dias.map(dia=>`<div class="dia">${dLbl(dia)} · ${porDia[dia].length} cambio(s)</div>
    ${porDia[dia].map(r=>`<div class="vis">
      <div class="l1"><b>${_esc(r.accionLbl)}</b>${r.monto==null?'':`<span style="font-weight:700">${money(r.monto)}</span>`}</div>
      <div class="l2">${_esc(r.hora)} · ${_esc(r.autor)}${r.propietario?' · '+_esc(r.propietario):''}${r.clave?' ('+_esc(r.clave)+')':''}</div>
      ${(r.campo||r.antes||r.despues)?`<div class="l2" style="white-space:normal">${r.campo?_esc(r.campo)+': ':''}${r.antes?_esc(r.antes)+' → ':''}<b>${_esc(r.despues||'—')}</b></div>`:''}
      ${r.detalle?`<div class="l2" style="white-space:normal">${_esc(r.detalle)}</div>`:''}</div>`).join('')}`).join('')
    :'<div class="aviso" style="background:#e4f5ec;border-color:#bfe6cf;color:#14663f">No hay cambios con esos filtros.</div>';
  // Los selectores conservan lo ya elegido: repintar no puede deshacer el filtro puesto.
  const va=_g('rg_autor'),vac=_g('rg_accion');
  document.getElementById('vRegistro').innerHTML=`
    <p style="color:var(--ac-muted);font-size:.8rem;margin-top:0">Toda acción que <b>modifica datos</b> queda
      anotada con su autor. Las consultas no se registran. <b>La bitácora no se puede editar ni borrar.</b></p>
    <details><summary>Filtrar${f.length?` · ${f.length} cambio(s)${d.total>f.length?' de '+d.total:''}`:''}</summary>
      <div class="dos" style="margin-top:8px">
        <div><label class="lb">Desde</label><input type="date" id="rg_desde" value="${_esc(_g('rg_desde'))}"/></div>
        <div><label class="lb">Hasta</label><input type="date" id="rg_hasta" value="${_esc(_g('rg_hasta'))}"/></div>
      </div>
      <label class="lb">Autor</label><select id="rg_autor"><option value="">Todos</option>${(d.autores||[]).map(a=>`<option${a===va?' selected':''}>${_esc(a)}</option>`).join('')}</select>
      <label class="lb">Acción</label><select id="rg_accion"><option value="">Todas</option>${Object.entries(d.acciones||{}).map(([k,v])=>`<option value="${_esc(k)}"${k===vac?' selected':''}>${_esc(v)}</option>`).join('')}</select>
      <label class="lb">Buscar</label><input type="search" id="rg_q" value="${_esc(_g('rg_q'))}" placeholder="lote, propietario, campo…"/>
      <button class="acb go" onclick="cargarRegistro(true)">Aplicar</button>
    </details>
    <div>${cuerpo}</div>`;
}
boot();
</script>
</body>
</html>
