name: Deploy Apps Script

on:
  push:
    branches: [ main ]
    paths:
      - 'backend-aires/**'
      - 'router/**'
      - 'clientes.json'
      - 'scripts/deploy-gas.js'
      # Las pruebas y este mismo archivo también: un cambio en la barrera tiene que
      # volver a pasar por la barrera.
      - 'pruebas/**'
      - '.github/workflows/deploy-gas.yml'
  workflow_dispatch:
    inputs:
      solo:
        description: 'id de una sola copia (vacío = todas las activas)'
        required: false
        default: ''

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Corren antes de desplegar: una suite que sólo se mira a mano acaba sin mirarse.
      - run: sh pruebas/correr.sh

  deploy:
    name: Deploy GAS
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Deploy a Google Apps Script
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          # El router vive en otra cuenta de Google. Un editor de otro dominio puede
          # subirle código, pero no mover su despliegue, así que lleva su propia
          # credencial — las TRES piezas: el token se emite para una aplicación OAuth
          # concreta y presentarlo con otro client_id da «unauthorized_client».
          GOOGLE_CLIENT_ID_BC: ${{ secrets.GOOGLE_CLIENT_ID_BC }}
          GOOGLE_CLIENT_SECRET_BC: ${{ secrets.GOOGLE_CLIENT_SECRET_BC }}
          GOOGLE_REFRESH_TOKEN_BC: ${{ secrets.GOOGLE_REFRESH_TOKEN_BC }}
        run: |
          if [ -n "${{ github.event.inputs.solo }}" ]; then
            node scripts/deploy-gas.js --solo "${{ github.event.inputs.solo }}"
          else
            node scripts/deploy-gas.js
          fi
